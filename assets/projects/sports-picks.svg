<svg xmlns="http://www.w3.org/2000/svg" width="840" height="156" viewBox="0 0 840 156" role="img" aria-label="Real-time Sports Pick'em Platform">
<title>Real-time Sports Pick'em Platform</title>
<style>
  .t{font:700 19px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#c0caf5}
  .d{font:600 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#70a5fd;letter-spacing:.3px}
  .g{font:400 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#a9b1d6}
  .chip{font:600 11px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#c0caf5}
  .b{font:700 10px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#1a1b27;letter-spacing:1px}
  .h{font:500 11px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#565f89}
  .in{opacity:0;animation:in .7s ease-out forwards}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .glow{animation:dash 6s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-1960}}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1b27"/><stop offset="1" stop-color="#24283b"/></linearGradient>
  <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#70a5fd" stop-opacity="0"/><stop offset=".5" stop-color="#70a5fd"/><stop offset="1" stop-color="#70a5fd" stop-opacity="0"/></linearGradient>
</defs>
<rect x="1" y="1" width="838" height="154" rx="14" fill="url(#bg)" stroke="#2f334d"/>
<rect x="1" y="1" width="838" height="154" rx="14" fill="none" stroke="url(#ac)" stroke-width="2" stroke-dasharray="300 1660" class="glow"/>
<g class="in" style="animation-delay:.05s">
  <rect x="736" y="18" width="80" height="20" rx="10" fill="#70a5fd"/>
  <g transform="translate(744,22)" fill="#1a1b27"><rect x="0" y="5" width="9" height="7" rx="1.5"/><path d="M2 5V3.5a2.5 2.5 0 0 1 5 0V5" stroke="#1a1b27" stroke-width="1.6" fill="none"/></g>
  <text x="784" y="32" text-anchor="middle" class="b">PRIVATE</text>
  <text x="24" y="34" class="d">SPORTS · FANTASY / PICK'EM · CONSUMER APP</text>
</g>
<g class="in" style="animation-delay:.2s"><text x="24" y="66" class="t">Real-time Sports Pick'em Platform</text></g>
<g class="in" style="animation-delay:.35s"><text x="24" y="92" class="g">Live player-stat ingestion, entry settlement and payouts for a high-traffic fantasy sports product.</text></g>
<g class="in" style="animation-delay:.5s"><g transform="translate(24,104)"><rect width="58" height="22" rx="11" fill="#70a5fd" fill-opacity="0.14" stroke="#70a5fd" stroke-opacity="0.5"/><text x="29" y="15" text-anchor="middle" class="chip">NestJS</text></g><g transform="translate(88,104)"><rect width="84" height="22" rx="11" fill="#70a5fd" fill-opacity="0.14" stroke="#70a5fd" stroke-opacity="0.5"/><text x="42" y="15" text-anchor="middle" class="chip">TypeScript</text></g><g transform="translate(178,104)"><rect width="84" height="22" rx="11" fill="#70a5fd" fill-opacity="0.14" stroke="#70a5fd" stroke-opacity="0.5"/><text x="42" y="15" text-anchor="middle" class="chip">PostgreSQL</text></g><g transform="translate(268,104)"><rect width="51" height="22" rx="11" fill="#70a5fd" fill-opacity="0.14" stroke="#70a5fd" stroke-opacity="0.5"/><text x="25.5" y="15" text-anchor="middle" class="chip">Redis</text></g><g transform="translate(325,104)"><rect width="51" height="22" rx="11" fill="#70a5fd" fill-opacity="0.14" stroke="#70a5fd" stroke-opacity="0.5"/><text x="25.5" y="15" text-anchor="middle" class="chip">Kafka</text></g><g transform="translate(382,104)"><rect width="38" height="22" rx="11" fill="#70a5fd" fill-opacity="0.14" stroke="#70a5fd" stroke-opacity="0.5"/><text x="19" y="15" text-anchor="middle" class="chip">AWS</text></g></g>
<text x="816" y="146" text-anchor="end" class="h pulse">▸ click to expand case study</text>
</svg>
